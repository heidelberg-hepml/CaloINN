# General
# data_path: ... # TODO: Path to the data

# Documenter information
run_name: photons
vae_dir: null
# Data
dtype: float32
particle_type: photon
dataset: 1
val_frac: 0.2
eps: 1.e-10
threshold: 1.e-10


# VAE
VAE_type: CVAE
VAE_learnable_norm: False
# VAE Preprocessing
alpha: 1.e-6
VAE_internal_threshold: 1.e-8
VAE_einc_preprocessing: "logit"
# VAE Training
VAE_lr_scheduler: null
VAE_max_lr: 1.e-4
VAE_lr: 1.e-4
VAE_weight_decay: 1.e-7
VAE_batch_size: 256
VAE_n_epochs: 1000
VAE_save_interval: 50
VAE_keep_models: 3001
VAE_zero_logit: True # Set the logit loss to 0
sparsity_loss: null
VAE_smearing_self: 0.6
VAE_smearing_share: 0.05
# VAE Architecture
VAE_hidden_sizes: [5000, 1000, 500]
VAE_latent_dim: 50
VAE_beta: 1.e-5
VAE_gamma: 1.e+4


# INN

# Data
latent_type: pre_sampling # post_sampling or pre_sampling or only_means
# INN Preprocessing
logit_transformation: False
log_cond: True
# INN Training
lr: 5.e-5
max_lr: 5.e-4
batch_size: 256
lr_scheduler: one_cycle_lr
weight_decay: 0.
betas: [0.9, 0.999]
n_epochs: 200
save_interval: 50
keep_models: 1000
# Bayesian Setup
bayesian: False
# INN Architecture
n_blocks: 18
internal_size: 32
layers_per_block: 3
coupling_type: rational_quadratic
bounds_init: 20
permute_soft: False
num_bins: 10
dropout: 0.0
